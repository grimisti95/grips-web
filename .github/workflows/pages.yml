name: Publicar sitio de GRIPS
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener solo este repositorio
        uses: actions/checkout@v4
      - name: Comprobar contenido público
        run: node scripts/check.mjs --publish
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir únicamente la web estática
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
